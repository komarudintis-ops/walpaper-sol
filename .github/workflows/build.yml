name: Build Solana Live Wallpaper APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-tier: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Android Live Wallpaper Project
        run: |
          mkdir -p app/src/main/java/com/solana/wallpaper
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SolanaLiveWallpaper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.solana.wallpaper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.solana.wallpaper"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Solana Live Tracker</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.solana.wallpaper.MainActivity"
              android:description="@string/app_name" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.DeviceDefault.Dialog.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SolanaWallpaperService"
                      android:exported="true"
                      android:label="Solana Road to 100 SOL"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/solana/wallpaper/MainActivity.kt
          package com.solana.wallpaper

          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.widget.*
          import kotlin.math.roundToInt

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("solana_wp_prefs", Context.MODE_PRIVATE)
                  val currentSol = prefs.getFloat("sol_goal_amount", 1.0f)

                  val dp = resources.displayMetrics.density
                  fun Int.toPx() = (this * dp).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(24.toPx(), 24.toPx(), 24.toPx(), 24.toPx())
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0F1118"))
                          cornerRadius = 20f * dp
                          setStroke(2, Color.parseColor("#30FFFFFF"))
                      }
                  }

                  val title = TextView(this).apply {
                      text = "UPDATE MODAL TRADING"
                      textSize = 15f
                      setTypeface(Typeface.DEFAULT_BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 18.toPx())
                  }
                  root.addView(title)

                  val inputSol = EditText(this).apply {
                      setText(String.format("%.1f", currentSol).replace(",", "."))
                      textSize = 24f
                      setTypeface(Typeface.DEFAULT_BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#050508"))
                          cornerRadius = 12f * dp
                          setStroke(2.toPx(), Color.parseColor("#00C2FF"))
                      }
                      setPadding(16.toPx(), 10.toPx(), 16.toPx(), 10.toPx())
                  }
                  root.addView(inputSol, LinearLayout.LayoutParams(150.toPx(), LinearLayout.LayoutParams.WRAP_CONTENT))

                  val seekBar = SeekBar(this).apply {
                      max = 198 // 1.0 sampai 100.0 dengan step 0.5
                      progress = ((currentSol - 1f) * 2f).roundToInt().coerceIn(0, 198)
                      setPadding(0, 20.toPx(), 0, 24.toPx())
                  }
                  root.addView(seekBar, LinearLayout.LayoutParams(260.toPx(), LinearLayout.LayoutParams.WRAP_CONTENT))

                  var isUpdating = false
                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser && !isUpdating) {
                              isUpdating = true
                              val v = 1f + (p / 2f)
                              inputSol.setText(String.format("%.1f", v).replace(",", "."))
                              isUpdating = false
                          }
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  inputSol.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          if (!isUpdating) {
                              isUpdating = true
                              val v = s.toString().toFloatOrNull() ?: 1f
                              seekBar.progress = ((v.coerceIn(1f, 100f) - 1f) * 2f).roundToInt()
                              isUpdating = false
                          }
                      }
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })

                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }

                  val btnCancel = Button(this).apply {
                      text = "Batal"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.TRANSPARENT)
                          cornerRadius = 12f * dp
                          setStroke(1.toPx(), Color.parseColor("#40FFFFFF"))
                      }
                      setOnClickListener { finish() }
                  }

                  val btnSave = Button(this).apply {
                      text = "Simpan"
                      setTextColor(Color.BLACK)
                      setTypeface(Typeface.DEFAULT_BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#14F195"))
                          cornerRadius = 12f * dp
                      }
                      setOnClickListener {
                          val v = (inputSol.text.toString().toFloatOrNull() ?: 1f).coerceIn(1f, 100f)
                          prefs.edit().putFloat("sol_goal_amount", v).apply()
                          finish()
                      }
                  }

                  val lpBtn = LinearLayout.LayoutParams(0, 46.toPx(), 1f).apply {
                      setMargins(6.toPx(), 0, 6.toPx(), 0)
                  }
                  btnRow.addView(btnCancel, lpBtn)
                  btnRow.addView(btnSave, lpBtn)
                  root.addView(btnRow, LinearLayout.LayoutParams(260.toPx(), LinearLayout.LayoutParams.WRAP_CONTENT))

                  val btnApplyWp = Button(this).apply {
                      text = "PASANG SEBAGAI LIVE WALLPAPER"
                      textSize = 11f
                      setTypeface(Typeface.DEFAULT_BOLD)
                      setTextColor(Color.WHITE)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.parseColor("#9945FF"), Color.parseColor("#00C2FF"))
                      ).apply { cornerRadius = 10f * dp }
                      setOnClickListener {
                          val v = (inputSol.text.toString().toFloatOrNull() ?: 1f).coerceIn(1f, 100f)
                          prefs.edit().putFloat("sol_goal_amount", v).apply()
                          try {
                              val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                                  putExtra(
                                      WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                                      ComponentName(this@MainActivity, SolanaWallpaperService::class.java)
                                  )
                              }
                              startActivity(intent)
                          } catch (e: Exception) {
                              val intent = Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER)
                              startActivity(intent)
                          }
                          finish()
                      }
                  }
                  val lpApply = LinearLayout.LayoutParams(260.toPx(), 44.toPx()).apply {
                      topMargin = 14.toPx()
                  }
                  root.addView(btnApplyWp, lpApply)

                  setContentView(root)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/solana/wallpaper/SolanaWallpaperService.kt
          package com.solana.wallpaper

          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.os.Handler
          import android.os.Looper
          import android.service.wallpaper.WallpaperService
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import kotlin.math.*
          import kotlin.random.Random

          class SolanaWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = SolanaEngine()

              inner class SolanaEngine : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private var visible = false
                  private var width = 0f
                  private var height = 0f
                  private var dp = 1f

                  private var targetSol = 1f
                  private var animatedSol = 1f

                  private val btnMinusRect = RectF()
                  private val btnConfigRect = RectF()
                  private val btnPlusRect = RectF()
                  private var downX = 0f
                  private var downY = 0f

                  private val particles = mutableListOf<Particle>()
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG)

                  inner class Particle(
                      var x: Float,
                      var y: Float,
                      val radius: Float,
                      val speedY: Float,
                      val alpha: Int,
                      val color: Int
                  )

                  private val drawRunner = object : Runnable {
                      override fun run() {
                          drawFrame()
                          if (visible) {
                              handler.postDelayed(this, 16L)
                          }
                      }
                  }

                  override fun onCreate(surfaceHolder: SurfaceHolder?) {
                      super.onCreate(surfaceHolder)
                      setTouchEventsEnabled(true)
                      dp = resources.displayMetrics.density
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) {
                          val prefs = getSharedPreferences("solana_wp_prefs", Context.MODE_PRIVATE)
                          targetSol = prefs.getFloat("sol_goal_amount", 1.0f).coerceIn(1f, 100f)
                          handler.removeCallbacks(drawRunner)
                          handler.post(drawRunner)
                      } else {
                          handler.removeCallbacks(drawRunner)
                      }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder?, format: Int, w: Int, h: Int) {
                      super.onSurfaceChanged(holder, format, w, h)
                      width = w.toFloat()
                      height = h.toFloat()
                      initParticles()
                  }

                  private fun initParticles() {
                      particles.clear()
                      for (i in 0 until 24) {
                          particles.add(
                              Particle(
                                  x = Random.nextFloat() * width,
                                  y = Random.nextFloat() * height,
                                  radius = (Random.nextFloat() * 2f + 0.8f) * dp,
                                  speedY = -(Random.nextFloat() * 0.45f + 0.15f) * dp,
                                  alpha = (Random.nextFloat() * 150 + 35).toInt(),
                                  color = if (Random.nextBoolean()) Color.parseColor("#9945FF") else Color.parseColor("#14F195")
                              )
                          )
                      }
                  }

                  override fun onTouchEvent(event: MotionEvent?) {
                      if (event == null) return
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.x
                              downY = event.y
                          }
                          MotionEvent.ACTION_UP -> {
                              if (hypot(event.x - downX, event.y - downY) < 15f * dp) {
                                  when {
                                      btnMinusRect.contains(event.x, event.y) -> adjustSol(-1f)
                                      btnPlusRect.contains(event.x, event.y) -> adjustSol(1f)
                                      btnConfigRect.contains(event.x, event.y) -> {
                                          val intent = Intent(this@SolanaWallpaperService, MainActivity::class.java).apply {
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          }
                                          startActivity(intent)
                                      }
                                  }
                              }
                          }
                      }
                      super.onTouchEvent(event)
                  }

                  private fun adjustSol(delta: Float) {
                      val prefs = getSharedPreferences("solana_wp_prefs", Context.MODE_PRIVATE)
                      targetSol = ((targetSol + delta) * 10f).roundToInt() / 10f
                      targetSol = targetSol.coerceIn(1f, 100f)
                      prefs.edit().putFloat("sol_goal_amount", targetSol).apply()
                  }

                  private fun drawFrame() {
                      val holder = surfaceHolder ?: return
                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          if (canvas != null) {
                              renderWallpaper(canvas)
                          }
                      } finally {
                          if (canvas != null) {
                              try { holder.unlockCanvasAndPost(canvas) } catch (_: Exception) {}
                          }
                      }
                  }

                  private fun renderWallpaper(canvas: Canvas) {
                      val now = System.currentTimeMillis()
                      animatedSol += (targetSol - animatedSol) * 0.14f

                      // 1. Background #050508
                      canvas.drawColor(Color.parseColor("#050508"))

                      // 2
